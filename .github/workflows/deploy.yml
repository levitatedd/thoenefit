name: Test and deploy

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Server checks on SQLite
        run: php tests/run.php
      - name: Server checks on MySQL (what DreamHost runs)
        run: |
          sudo systemctl start mysql.service
          TF_TEST_DB=mysql TF_MYSQL_HOST=127.0.0.1 TF_MYSQL_USER=root TF_MYSQL_PASSWORD=root php tests/run.php
      - name: Offline queue checks
        run: node tests/sync.test.mjs
      - name: Exercise search checks
        run: node tests/search.test.mjs
      - name: Estimated 1-rep max checks
        run: node tests/strength.test.mjs
      - name: Install reminder checks
        run: node tests/install.test.mjs
      - name: Version number checks
        run: node tests/version.test.mjs
      - name: Release notes checks
        run: node tests/changelog.test.mjs
      # The browser walk-through (#217): the app on a fresh SQLite database with the e2e user,
      # clicked through at phone size in headless Chromium. Any failed check fails the job.
      - name: Browser walk-through
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          rm -rf data
          printf 'gym-test-password\n' | php web/private/bin/create-user.php e2e "E2E"
          php -S 127.0.0.1:8765 -t web > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 1
          node tests/e2e.mjs | tee "$RUNNER_TEMP/e2e.log"
      - name: List failed walk-through checks
        if: failure()
        run: |
          { echo '### Browser walk-through failures'; grep -E 'FAIL|Error' "$RUNNER_TEMP/e2e.log" || echo 'No walk-through output: it failed before or while starting.'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'FAIL|Error' "$RUNNER_TEMP/e2e.log" || true
          echo '--- PHP server log'; tail -40 "$RUNNER_TEMP/php.log" || true

  deploy:
    name: Upload to DreamHost
    needs: test
    # Pull requests only run the checks. Manual runs have the same branch restrictions.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_PATH: ${{ github.ref_name == 'staging' && '/home/thoenefit/fit-test.mikethoene.com' || secrets.SFTP_PATH }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The version number counts releases on main, so it needs main's full history.
          fetch-depth: 0

      - name: Check that the server details are set
        id: cfg
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$SFTP_PATH" ]; then
            echo "::notice::Deploy skipped. Add the SFTP repository secrets (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == staging && "${SFTP_PATH%/}" != "/home/$SFTP_USER/fit-test.mikethoene.com" ]]; then
            echo "::error::Staging requires the thoenefit SFTP user and its fit-test.mikethoene.com web folder."
            exit 1
          fi
          case "$SFTP_PATH" in
            /|/home|/home/|"~"|"~/"|.|./)
              echo "::error::SFTP_PATH must be the site's web folder (for example /home/username/fit.example.com), not '$SFTP_PATH'."
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check the connection to the server
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # Accept a host pasted as sftp://host/ or user@host as well as a bare hostname.
          HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]')"
          HOST="${HOST#*://}"; HOST="${HOST#*@}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          if ! getent hosts "$HOST" >/dev/null; then
            echo "The SFTP_HOST secret is ${#HOST} characters long and $(printf '%s' "$HOST" | tr -cd '.' | wc -c) of them are dots."
            echo "::error::SFTP_HOST does not resolve to a server. Use the hostname DreamHost shows for the user (or the site's domain), with nothing before or after it."
            exit 1
          fi
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$HOST/22" 2>/dev/null; then
            echo "::error::Reached SFTP_HOST but port 22 (SFTP) did not answer."
            exit 1
          fi
          echo "Server found and SFTP port is open."

      - name: Stamp the build
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # The app compares version.json with the build it started with and reloads
          # itself when they differ. sw.js gets the same id, so phones replace their
          # saved copies of the app files on every deploy.
          BUILD="${GITHUB_SHA::12}"
          # The human-readable version shown at the bottom of Settings (see VERSION).
          APP_VERSION="$(.github/scripts/app-version.sh "$GITHUB_REF_NAME")"
          printf '{"build":"%s","version":"%s"}\n' "$BUILD" "$APP_VERSION" > web/version.json
          sed -i "s/^const BUILD = 'dev';/const BUILD = '$BUILD';/" web/sw.js
          grep -q "const BUILD = '$BUILD';" web/sw.js || { echo "::error::Could not stamp the build into web/sw.js."; exit 1; }
          sed -i "s/^export const APP_VERSION = 'dev';/export const APP_VERSION = '$APP_VERSION';/" web/js/version.js
          grep -q "export const APP_VERSION = '$APP_VERSION';" web/js/version.js || { echo "::error::Could not stamp the version into web/js/version.js."; exit 1; }
          # The "What's new" notes, built from the pull requests each release brought in.
          APP_VERSION="$APP_VERSION" node .github/scripts/changelog.mjs "$GITHUB_REF_NAME" > web/changelog.json
          echo "Version $APP_VERSION, build $BUILD"

      - name: Upload the web folder over SFTP
        if: steps.cfg.outputs.ready == 'true'
        run: |
          command -v lftp >/dev/null || (sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null)
          # Uploads new and changed files. Nothing on the server is deleted, so
          # certificates, your config file and anything else already there are left alone.
          if ! lftp -c "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password --user '$SFTP_USER' 'sftp://$HOST';
            cd '$SFTP_PATH';
            mirror --reverse --verbose --no-perms --parallel=4 web/ .;
          "; then
            echo "::error::Upload failed. If the line above says 'Login failed', check SFTP_USER and SFTP_PASSWORD. If it says 'No such file', check SFTP_PATH (it should be the site's web folder, for example /home/USERNAME/fit.example.com)."
            exit 1
          fi

      - name: Done
        if: steps.cfg.outputs.ready == 'true'
        run: echo "::notice::Deployed. Database changes apply themselves the next time the app is opened."
