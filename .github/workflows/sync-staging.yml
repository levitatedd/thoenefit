name: Sync main back into staging

# After a release reaches main, open a pull request that merges main back into
# staging. Releases add a merge commit that only main has, and edits made
# directly on main would otherwise never reach staging, so without this staging
# keeps falling further "behind" main.
#
# It only opens the pull request. Merge it yourself, with "Create a merge
# commit" (not squash), so staging records main's commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    name: Open the sync pull request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check whether staging is missing anything from main
        id: check
        run: |
          behind=$(gh api "repos/$REPO/compare/staging...main" --jq '.ahead_by')
          echo "Commits on main that staging does not have: $behind"
          open=$(gh api "repos/$REPO/pulls?state=open&base=staging&head=$OWNER:main" --jq '.[0].number // empty')
          if [ "$behind" = "0" ]; then
            echo "Staging already has everything on main. Nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$open" ]; then
            echo "::notice::Sync pull request #$open is already open. It will include these commits too."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "behind=$behind" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.check.outputs.needed == 'true'
        run: |
          commits=$(gh api "repos/$REPO/compare/staging...main" --jq '.commits[] | "- " + .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Merges \`main\` back into \`staging\` after a release, so staging stops showing as behind main." \
            "Commits on \`main\` that \`staging\` does not have yet:" \
            "$commits" \
            "Merge with **Create a merge commit**, not squash, so staging records these commits. Opened automatically by the sync-staging workflow; checks do not run on pull requests opened this way, but everything here is already on main.")
          if ! gh api "repos/$REPO/pulls" -X POST -f base=staging -f head=main -f title="Sync main back into staging" -f body="$body" --jq '"Opened " + .html_url'; then
            echo "::warning::Could not open the pull request. In the repository's Settings > Actions > General, under Workflow permissions, tick 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow. Or open it by hand: https://github.com/$REPO/compare/staging...main"
            exit 1
          fi
